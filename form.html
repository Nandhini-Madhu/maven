<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Registration Form</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d0f; --surface: #16161a; --border: #2a2a32;
      --accent: #6ef7c4; --accent2: #f7a26e; --error: #ff5f72;
      --success: #6ef7c4; --text: #e8e8f0; --muted: #6b6b80;
    }
    body {
      background: var(--bg); font-family: 'DM Sans', sans-serif;
      min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 2rem; position: relative; overflow: hidden;
    }
    body::before {
      content: ''; position: fixed; top: -40%; left: -20%;
      width: 70vw; height: 70vw;
      background: radial-gradient(circle, rgba(110,247,196,0.06) 0%, transparent 70%);
      pointer-events: none;
    }
    body::after {
      content: ''; position: fixed; bottom: -40%; right: -20%;
      width: 60vw; height: 60vw;
      background: radial-gradient(circle, rgba(247,162,110,0.05) 0%, transparent 70%);
      pointer-events: none;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 24px; padding: 3rem; width: 100%; max-width: 480px;
      position: relative; animation: slideUp 0.6s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card-accent {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 80px; height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 0 0 4px 4px;
    }
    .header { margin-bottom: 2.5rem; }
    .header h1 {
      font-family: 'Syne', sans-serif; font-size: 2rem; font-weight: 800;
      color: var(--text); letter-spacing: -0.03em; line-height: 1.1;
    }
    .header h1 span { color: var(--accent); }
    .header p { margin-top: 0.5rem; color: var(--muted); font-size: 0.9rem; font-weight: 300; }
    .field { margin-bottom: 1.4rem; }
    label {
      display: block; font-size: 0.78rem; font-weight: 500; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.5rem;
    }
    .input-wrap { position: relative; }
    .input-wrap svg {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px; color: var(--muted); pointer-events: none; transition: color 0.2s;
    }
    input {
      width: 100%; padding: 0.85rem 1rem 0.85rem 2.8rem; background: #1e1e25;
      border: 1.5px solid var(--border); border-radius: 12px; color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 0.95rem; outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    input::placeholder { color: #3a3a48; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(110,247,196,0.1); }
    input:focus + svg, .input-wrap:focus-within svg { color: var(--accent); }
    input.error { border-color: var(--error); box-shadow: 0 0 0 3px rgba(255,95,114,0.1); }
    input.valid { border-color: var(--success); box-shadow: 0 0 0 3px rgba(110,247,196,0.08); }
    .msg {
      font-size: 0.78rem; margin-top: 0.4rem; min-height: 1rem; padding-left: 0.2rem;
      display: flex; align-items: center; gap: 0.3rem; opacity: 0;
      transform: translateY(-4px); transition: opacity 0.2s, transform 0.2s;
    }
    .msg.show { opacity: 1; transform: translateY(0); }
    .msg.err  { color: var(--error); }
    .msg.ok   { color: var(--success); }
    .submit-btn {
      margin-top: 2rem; width: 100%; padding: 1rem;
      background: linear-gradient(135deg, var(--accent), #4ad9a8);
      border: none; border-radius: 12px; color: #0a1a14;
      font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700;
      letter-spacing: 0.02em; cursor: pointer;
      transition: transform 0.18s, box-shadow 0.18s, opacity 0.18s;
      position: relative; overflow: hidden;
    }
    .submit-btn::after {
      content: ''; position: absolute; inset: 0;
      background: rgba(255,255,255,0.12); opacity: 0; transition: opacity 0.18s;
    }
    .submit-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(110,247,196,0.25); }
    .submit-btn:hover:not(:disabled)::after { opacity: 1; }
    .submit-btn:active:not(:disabled) { transform: translateY(0); box-shadow: none; }

    /* ✅ Disabled state */
    .submit-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .success-banner {
      display: none; margin-top: 1.2rem; padding: 1rem 1.2rem;
      background: rgba(110,247,196,0.08); border: 1px solid rgba(110,247,196,0.25);
      border-radius: 12px; color: var(--accent); font-size: 0.9rem; text-align: center;
      animation: fadeIn 0.4s ease both;
    }
    .success-banner.show { display: block; }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  </style>
</head>
<body>
<div class="card">
  <div class="card-accent"></div>
  <div class="header">
    <h1>Student<br/><span>Registration</span></h1>
    <p>Fill in the details below to register.</p>
  </div>
  <div class="field">
    <label for="name">Full Name</label>
    <div class="input-wrap">
      <input type="text" id="name" placeholder="e.g. Arjun Kumar" autocomplete="off"/>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
    <div class="msg" id="name-msg"></div>
  </div>
  <div class="field">
    <label for="phone">Phone Number</label>
    <div class="input-wrap">
      <input type="tel" id="phone" placeholder="e.g. 9876543210" maxlength="10" autocomplete="off"/>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.18h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.71 2.81a2 2 0 0 1-.45 2.11L7.91 8.91a16 16 0 0 0 6 6l.91-.91a2 2 0 0 1 2.11-.45c.91.35 1.85.58 2.81.71A2 2 0 0 1 22 16.92z"/></svg>
    </div>
    <div class="msg" id="phone-msg"></div>
  </div>
  <div class="field">
    <label for="roll">Roll Number</label>
    <div class="input-wrap">
      <input type="text" id="roll" placeholder="e.g. CS2024001" autocomplete="off"/>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 8h10M7 12h6M7 16h4"/></svg>
    </div>
    <div class="msg" id="roll-msg"></div>
  </div>

  <!-- ✅ id and disabled added -->
  <button id="registerBtn" class="submit-btn" onclick="submitForm()" disabled>Register Now →</button>
  <div class="success-banner" id="success-banner">✓ Registration successful! Welcome aboard.</div>
</div>

<script>
  const rules = {
    name:  { validate: v => v.trim().length >= 3 && /^[a-zA-Z\s]+$/.test(v.trim()), errorMsg: '✕ Name must be at least 3 letters (alphabets only).', okMsg: '✓ Looks good!' },
    phone: { validate: v => /^[6-9]\d{9}$/.test(v.trim()), errorMsg: '✕ Enter a valid 10-digit Indian mobile number.', okMsg: '✓ Valid number!' },
    roll:  { validate: v => /^[A-Za-z0-9]{4,15}$/.test(v.trim()), errorMsg: '✕ Roll number must be 4–15 alphanumeric characters.', okMsg: '✓ Roll number accepted!' }
  };

  // ✅ Enable/disable button
  function updateButton() {
    const ok = ['name','phone','roll'].every(id => rules[id].validate(document.getElementById(id).value));
    document.getElementById('registerBtn').disabled = !ok;
  }

  ['name','phone','roll'].forEach(id => {
    const input = document.getElementById(id);
    input.addEventListener('input', () => { validate(id, false); updateButton(); });
    input.addEventListener('blur',  () => { validate(id, true);  updateButton(); });
  });

  function validate(id, strict) {
    const input = document.getElementById(id);
    const msgEl = document.getElementById(id + '-msg');
    const val   = input.value;
    const rule  = rules[id];
    if (!val.trim().length) {
      setField(input, msgEl, strict ? '✕ This field is required.' : '', strict ? 'err' : '');
      return false;
    }
    if (rule.validate(val)) { setField(input, msgEl, rule.okMsg, 'ok'); return true; }
    else                    { setField(input, msgEl, rule.errorMsg, 'err'); return false; }
  }

  function setField(input, msgEl, text, type) {
    input.classList.remove('error','valid');
    msgEl.classList.remove('show','err','ok');
    if (type === 'ok')  { input.classList.add('valid'); msgEl.classList.add('show','ok'); }
    if (type === 'err') { input.classList.add('error'); msgEl.classList.add('show','err'); }
    msgEl.textContent = text;
  }

  function submitForm() {
    if (['name','phone','roll'].map(id => validate(id, true)).every(Boolean)) {
      const banner = document.getElementById('success-banner');
      banner.classList.add('show');
      setTimeout(() => {
        ['name','phone','roll'].forEach(id => {
          const el = document.getElementById(id);
          el.value = ''; el.classList.remove('valid','error');
          const msg = document.getElementById(id+'-msg');
          msg.classList.remove('show','ok','err'); msg.textContent = '';
        });
        banner.classList.remove('show');
        updateButton();
      }, 3000);
    }
  }
</script>
</body>
</html>
